server:
  port: 8081
spring:
  application:
    name: luminawalk
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/luminawalk?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: luminawalk
    password: password
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    password: ${REDIS_PASSWORD}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.luminawalk.entity # 别名扫描包
logging:
  level:
    com.luminawalk: debug
  pattern:
    dateformat: mm:ss.SSS