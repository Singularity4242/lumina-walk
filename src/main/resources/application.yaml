server:
  port: 8081
spring:
  application:
    name: luminawalk
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/luminawalk?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: luminawalk
    password: password
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    password: ${REDIS_PASSWORD}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: "luminawalk"
    password: "password"
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
